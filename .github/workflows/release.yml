name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump when not specifying an exact version'
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      version:
        description: 'Optional exact version without v prefix, e.g. 1.1.0'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend build
        run: |
          cd frontend
          npm ci
          npm run build
      - name: Tests
        run: |
          chmod +x mvnw
          ./mvnw -B test

  version:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      should_release: ${{ steps.resolve.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve version
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chmod +x scripts/next-version.sh
          MSG="${{ github.event.head_commit.message || '' }}"
          if [[ "$MSG" == *"[skip release]"* ]]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "Skip: commit marked [skip release]"
            exit 0
          fi
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="$(./scripts/next-version.sh "${{ inputs.bump || 'auto' }}")"
          fi
          if [[ -z "$VERSION" ]]; then
            echo "unable to resolve version" >&2
            exit 1
          fi
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            if [[ "$(git rev-parse "v${VERSION}^{commit}")" == "$(git rev-parse HEAD)" ]]; then
              if gh release view "v${VERSION}" >/dev/null 2>&1; then
                echo "should_release=false" >> "$GITHUB_OUTPUT"
                echo "version=$VERSION" >> "$GITHUB_OUTPUT"
                echo "Skip: v${VERSION} already published"
                exit 0
              fi
            else
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              echo "version=$VERSION" >> "$GITHUB_OUTPUT"
              echo "Skip: tag v${VERSION} already exists on another commit"
              exit 0
            fi
          fi
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "Skip: GitHub Release v${VERSION} already exists"
            exit 0
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "Will release v${VERSION}"

  jar:
    needs: [test, version]
    if: needs.version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Package release JAR
        run: |
          chmod +x mvnw scripts/package.sh scripts/start.sh scripts/set-version.sh
          ./scripts/package.sh "${{ needs.version.outputs.version }}"
      - name: Smoke the JAR
        run: |
          chmod +x scripts/smoke.sh
          java -jar dist/utils.jar --server.port=18080 &
          echo $! > /tmp/utils.pid
          for i in $(seq 1 40); do
            if curl -fsS "http://127.0.0.1:18080/actuator/health" | grep -Fq '"status":"UP"'; then
              break
            fi
            sleep 1
          done
          ./scripts/smoke.sh http://127.0.0.1:18080
          kill "$(cat /tmp/utils.pid)" || true
      - uses: actions/upload-artifact@v4
        with:
          name: utils-jar
          path: |
            dist/utils-${{ needs.version.outputs.version }}.jar
            dist/utils-${{ needs.version.outputs.version }}.jar.sha256
            dist/start.sh
            dist/start.bat
            dist/README.txt

  native:
    needs: [version, jar]
    if: needs.version.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            type: deb
            asset: linux-x64
            arch: x64
          - os: windows-latest
            type: exe
            asset: windows-x64
            arch: x64
          - os: macos-latest
            type: app-image
            asset: macos-arm64
            arch: aarch64
          - os: macos-15-intel
            type: app-image
            asset: macos-x64
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          architecture: ${{ matrix.arch }}
      - name: Install WiX 3
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install wixtoolset --version 3.14.1 -y --no-progress
          $candidates = @(
            "${env:ProgramFiles(x86)}\WiX Toolset v3.14\bin",
            "${env:ProgramFiles(x86)}\WiX Toolset v3.11\bin"
          )
          foreach ($wix in $candidates) {
            if (Test-Path $wix) {
              echo $wix | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            }
          }
      - name: Install Linux packagers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot binutils
      - uses: actions/download-artifact@v4
        with:
          name: utils-jar
          path: dist
      - name: Prepare jar name
        shell: bash
        run: |
          mkdir -p dist
          if [[ ! -f dist/utils.jar ]]; then
            cp dist/utils-*.jar dist/utils.jar
          fi
      - name: Native package
        shell: bash
        run: |
          chmod +x scripts/package-native.sh scripts/stage-native.py scripts/gen-icon.py
          ./scripts/package-native.sh "${{ needs.version.outputs.version }}" "${{ matrix.type }}"
          ls -la dist/native
          test -n "$(ls dist/native/utils-${{ needs.version.outputs.version }}-${{ matrix.asset }}.*)"
      - uses: actions/upload-artifact@v4
        with:
          name: utils-native-${{ matrix.asset }}
          path: dist/native/utils-*
          if-no-files-found: error

  publish:
    needs: [version, jar, native]
    if: needs.version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: v${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: |
            artifacts/utils-jar/utils-*.jar
            artifacts/utils-jar/utils-*.jar.sha256
            artifacts/utils-jar/start.sh
            artifacts/utils-jar/start.bat
            artifacts/utils-jar/README.txt
            artifacts/utils-native-*/*
          body: |
            测试通过后自动发行。原生包装了对应芯片的运行时。

            **服务器 JAR**（任意系统，需本机 JDK 21+）
            ```bash
            java -jar utils-${{ needs.version.outputs.version }}.jar
            ```
            浏览器打开 http://localhost:8080/

            **桌面模式**（同一 JAR）
            ```bash
            ./start.sh
            start.bat
            ```

            **系统安装包**（自带运行时，按芯片选，下载后即可用）
            - Windows x64：`utils-${{ needs.version.outputs.version }}-windows-x64.exe`，双击安装，开始菜单打开 Utils
            - Linux x64：`utils-${{ needs.version.outputs.version }}-linux-x64.deb` 双击 / `dpkg -i`；或不安装，解压 `utils-${{ needs.version.outputs.version }}-linux-x64.tar.gz` 后执行 `./Utils`
            - macOS Apple Silicon（M1/M2/M3/M4，arm64）：`utils-${{ needs.version.outputs.version }}-macos-arm64.app.zip`，解压得 `Utils.app` 双击打开
            - macOS Intel（x64）：`utils-${{ needs.version.outputs.version }}-macos-x64.app.zip`，解压得 `Utils.app` 双击打开
