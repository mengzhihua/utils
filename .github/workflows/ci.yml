name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main
    tags-ignore:
      - 'v*'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend build
        run: |
          cd frontend
          npm ci
          npm run build
      - name: Tests
        run: |
          chmod +x mvnw
          ./mvnw -B test
