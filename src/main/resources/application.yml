server:
  port: 8080

spring:
  application:
    name: utils
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai
  messages:
    basename: i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: false
  web:
    locale: en

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    description: Spring Boot Java utils console

utils:
  snowflake:
    worker-id: 1
    datacenter-id: 1
